title: Sistema de monedas (Ejemplo)
titleEn: Coin system (Example)
summary:
  es: Monedas con leaderstats, guardado de datos y UI animada.
  en: Coins with leaderstats, data saving and an animated UI.
description:
  es: |-
    Proyecto de ejemplo para probar el portafolio. Reemplázalo o bórralo desde el panel.

    El servidor es la única fuente de verdad: el cliente nunca modifica monedas, solo las muestra. La configuración vive en un ModuleScript compartido para que servidor y cliente usen los mismos valores.
  en: |-
    Sample project to test the portfolio. Replace or delete it from the panel.

    The server is the single source of truth: the client never changes coins, it only displays them. Configuration lives in a shared ModuleScript so server and client use the same values.
